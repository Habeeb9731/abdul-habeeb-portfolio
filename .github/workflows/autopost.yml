name: Blog autopost

# Writes one news post per run (see tools/blog/autopost.py), rebuilds the blog and pushes to master,
# which Cloudflare Pages then deploys. The schedule runs on the Hetzner server (systemd timer
# blog-autopost.timer at 07:15, 12:15 and 17:15 Berlin time); this workflow is a manual backup only.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/blog/autopost-requirements.txt

      - run: pip install -r tools/blog/autopost-requirements.txt

      - name: Write a post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python tools/blog/autopost.py --count 1

      - name: Rebuild the blog
        run: python tools/blog/build.py

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/blog public/resources/blog blog
          if git diff --cached --quiet; then echo 'Nothing new.'; exit 0; fi
          git commit -m "Add blog post: $(git diff --cached --name-only --diff-filter=A tools/blog/posts | head -1 | xargs -r basename -s .md)"
          git pull --rebase origin master
          git push origin HEAD:master
