<script>
const themeToggle=document.querySelector('.theme-toggle');

let initialDark=false;try{initialDark=localStorage.getItem('theme')==='dark'}catch(e){}
applyTheme(initialDark);
themeToggle.addEventListener('click',()=>applyTheme(!document.body.classList.contains('dark')));
window.addEventListener('pageshow',()=>{let t=null;try{t=localStorage.getItem('theme')}catch(e){};if(t&&(t==='dark')!==document.body.classList.contains('dark'))applyTheme(t==='dark')});
const sideLinks=[...document.querySelectorAll('.cs-sidenav a')];
const sideIndicator=document.querySelector('.cs-sidenav-indicator');
let sideY=null;
function moveSide(link){
  const to=link.offsetTop,size=link.offsetHeight,from=sideY;
  sideLinks.forEach(l=>l.classList.toggle('is-active',l===link));
  const tabIcon=document.querySelector('.cs-sidetab-icon svg');if(tabIcon)tabIcon.innerHTML=link.querySelector('svg').innerHTML;
  sideIndicator.style.height=size+'px';sideIndicator.style.transform=`translateY(${to}px)`;sideIndicator.style.opacity='1';sideY=to;
  if(from===null||from===to||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const down=to>from,start=Math.min(from,to),span=Math.abs(to-from)+size;
  sideIndicator.getAnimations().forEach(a=>a.cancel());

    {transform:`translateY(${from}px)`,height:size+'px',width:size+'px',marginLeft:'0px'},
    {transform:`translateY(${start}px)`,height:span+'px',width:(size-6)+'px',marginLeft:'3px',offset:.42},
    {transform:`translateY(${to+(down?3:-3)}px)`,height:(size-4)+'px',width:(size+2)+'px',marginLeft:'-1px',offset:.72},
    {transform:`translateY(${to}px)`,height:size+'px',width:size+'px',marginLeft:'0px'}

}
let sideLock=0;
sideLinks.forEach(l=>l.addEventListener('click',()=>{sideLock=Date.now()+1400;moveSide(l)}));
const sideNav=document.querySelector('.cs-sidenav'),sideTab=document.querySelector('.cs-sidetab');
sideLinks.forEach((l,i)=>l.style.setProperty('--i',i));
let sideAnim=null;
const sideReduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const sideCircle=()=>{const w=sideNav.offsetWidth,h=sideNav.offsetHeight;return `translate(0,-50%) scale(${48/w},${48/h})`};

    if(sideReduce())return;
    sideAnim=sideNav.animate([
      {transform:sideCircle(),borderRadius:'50%'},
      {transform:'translate(0,-50%) scale(1.06,.95)',borderRadius:'26px',offset:.5},
      {transform:'translate(0,-50%) scale(.97,1.03)',offset:.72},
      {transform:'translate(0,-50%) scale(1.01,.995)',offset:.88},
      {transform:'translate(0,-50%) scale(1)',borderRadius:'26px'}

  }else{
    sideNav.classList.add('is-closing');
    const done=()=>{document.body.classList.remove('cs-side-landing');void document.body.offsetWidth;document.body.classList.add('cs-side-landing');sideNav.classList.remove('is-open','is-closing');document.body.classList.remove('cs-side-open');if(sideAnim){sideAnim.cancel();sideAnim=null}};
    if(sideReduce())return done();
    sideAnim=sideNav.animate([
      {transform:'translate(0,-50%) scale(1)',borderRadius:'26px'},
      {transform:'translate(0,-50%) scale(1.04,.97)',borderRadius:'26px',offset:.22},
      {transform:sideCircle(),borderRadius:'50%'}

    sideAnim.onfinish=done;
  }
};
sideTab.addEventListener('click',e=>{e.stopPropagation();setSide(!sideNav.classList.contains('is-open'))});
document.addEventListener('click',e=>{if(sideNav.classList.contains('is-open')&&!sideNav.contains(e.target))setSide(false)});

let sideTouchX=null;

sideLinks.forEach(l=>{const t=document.querySelector(l.hash);if(t)sideObserver.observe(t)});
requestAnimationFrame(()=>moveSide(sideLinks[0]));
</script>
